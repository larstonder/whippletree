name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # whippletree does not support running bundles on Windows yet (see
  # README and issue #1), but it must keep compiling and vetting cleanly
  # there, because the exec-bit bug that made every handler silently skip
  # was only ever going to be caught by a machine that ran it.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -cover

  minimum-go:
    name: go.mod minimum
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # GOTOOLCHAIN=local pins this to the version go.mod declares. On
      # auto, adding a toolchain directive would silently fetch a newer
      # one and make this job a duplicate of `test` without failing.
      - run: go build ./...
        env:
          GOTOOLCHAIN: local
      - run: go test ./...
        env:
          GOTOOLCHAIN: local

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt needed:"; echo "$unformatted"
            gofmt -d .
            exit 1
          fi

      - name: vet for windows
        run: GOOS=windows go vet ./...

      - name: licence headers
        run: |
          missing=$(git ls-files '*.go' | xargs grep -L 'SPDX-License-Identifier' || true)
          if [ -n "$missing" ]; then
            echo "::error::Go files without an SPDX header:"; echo "$missing"
            exit 1
          fi

  # examples/kb-shaped's compiled artifacts are committed as fixtures, so
  # a build that no longer reproduces them byte-for-byte is a silent
  # change to what every user's bundle looks like.
  artifacts-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true
      - run: go build -o examples/kb-shaped/bin/whippletree-hook ./cmd/whippletree-hook
      - run: go run ./cmd/whippletree build examples/kb-shaped --targets-dir targets --allow-refuse
      # git diff only sees tracked files, so a build that starts emitting
      # a brand-new artifact would pass silently.
      - name: committed artifacts unchanged
        run: |
          changed=$(git status --porcelain -- examples/kb-shaped)
          if [ -n "$changed" ]; then
            echo "::error::whippletree build no longer reproduces the committed artifacts"
            echo "$changed"
            git diff -- examples/kb-shaped
            exit 1
          fi

  # The release builds six GOOS/GOARCH pairs; without this only the host
  # three are ever compiled before a tag.
  cross:
    name: cross (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go build ./... && go vet ./...
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
