name: e2e

# The e2e suite drives the real harness CLIs, so it needs each one
# installed and, for opencode, network access to its default hosted
# model. That is too slow and too dependent on third parties to gate
# every pull request on, but it is the only thing that proves a target
# definition still matches the harness it describes -- which is the
# claim metadata.testedVersions makes. Nightly plus on demand.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: e2e (${{ matrix.harness }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: claude
            package: "@anthropic-ai/claude-code"
            script: test/e2e/run-claude.sh
            timeout: 20
          - harness: codex
            package: "@openai/codex"
            script: test/e2e/run-codex.sh
            timeout: 20
          # opencode's first run in a fresh config dir installs a
          # node_modules tree and can exceed five minutes before the
          # script's own 900s watchdog even starts counting.
          - harness: opencode
            package: opencode-ai
            script: test/e2e/run-opencode.sh
            timeout: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: install ${{ matrix.harness }}
        env:
          PKG: ${{ matrix.package }}
        run: npm install -g "$PKG"

      - name: run
        env:
          SCRIPT: ${{ matrix.script }}
        run: bash "$SCRIPT"
        timeout-minutes: ${{ matrix.timeout }}

  # Nightly runs are only worth having if a drift shows up somewhere a
  # person looks. Any harness whose e2e failed lands here.
  report:
    needs: e2e
    if: always() && needs.e2e.result != 'success' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: open or update a drift issue
        env:
          GH_TOKEN: ${{ github.token }}
          # gh resolves the repo from git remotes, and this job has no
          # checkout. GITHUB_REPOSITORY is not a fallback; GH_REPO is.
          GH_REPO: ${{ github.repository }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="e2e drift: a harness no longer matches its target definition"
          body=$(printf 'Nightly e2e failed. A harness has likely changed under a target definition; check whether metadata.testedVersions still holds.\n\nRun: %s\n' "$RUN")
          existing=$(gh issue list --state open --label e2e-drift --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh label create e2e-drift --description "Nightly e2e detected harness drift" --color B60205 --force >/dev/null 2>&1 || true
            gh issue create --title "$title" --label e2e-drift --body "$body"
          fi
