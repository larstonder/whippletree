apiVersion: adaptersdk.dev/v1
kind: TargetDefinition
metadata:
  name: codex
  class: 1
  schemaVersion: "1.0.0"
  testedVersions: ">=0.144.0"
spec:
  discovery:
    manifestDir: ".codex-plugin"
    hooksKey: "hooks"
    mergeSemantics: replace
  probe:
    command: ["codex", "--version"]
    versionPattern: 'codex-cli (\d+\.\d+\.\d+)'
  events:
    session-start: { native: SessionStart, blocking: false }
    session-end:   { native: SessionEnd, blocking: false }
    tool-pre:      { native: PreToolUse, blocking: true }
    tool-post:     { native: PostToolUse, blocking: false }
    turn-end:      { native: Stop, blocking: true, loopGuardField: stop_hook_active }
  toolClassMap:
    read: null          # no file-read tool exists (verified: hook_names.rs)
    write: apply_patch
    shell: Bash
  degradations:
    file-read:
      tier: T2
      matcher: "Bash|Edit|Write|apply_patch"
      lossage: "misses reads in pipelines/heredocs/scripts; may double-count"
  strictness:
    unknownFieldsFatal: true
  env:
    pluginRoot: ["PLUGIN_ROOT", "CLAUDE_PLUGIN_ROOT"]
  capabilities:
    bundleChannel: true
    stopLoopGuard: true
    matcherAlternation: true
